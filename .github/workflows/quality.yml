name: quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Enforce pull-request metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$HEAD_REF" in
            agent/*) ;;
            *) echo "Branch must use the agent/<description> convention: $HEAD_REF"; exit 1 ;;
          esac
          python3 scripts/check_pr_title.py "$PR_TITLE"

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Markdown documents
        run: python3 scripts/check_docs.py

      - name: Check whitespace errors
        run: git diff --check HEAD^
