name: quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Enforce pull-request metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$HEAD_REF" in
            agent/*) ;;
            *) echo "Branch must use the agent/<description> convention: $HEAD_REF"; exit 1 ;;
          esac
          python3 scripts/check_pr_title.py "$PR_TITLE"

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Markdown documents
        run: python3 scripts/check_docs.py

      - name: Check whitespace errors
        run: git diff --check HEAD^

  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://opennosh:opennosh@localhost:5432/opennosh_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opennosh_test
          POSTGRES_USER: opennosh
          POSTGRES_PASSWORD: opennosh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennosh -d opennosh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install API dependencies
        run: uv sync --frozen

      - name: Lint API
        run: uv run ruff check api

      - name: Type-check API
        run: uv run mypy

      - name: Validate food packs
        run: PYTHONPATH=api uv run python -m opennosh_api.foodpacks.validation packs --json

      - name: Test API
        run: uv run pytest api/tests

  web:
    name: web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint web app
        run: npm --prefix web run lint

      - name: Type-check web app
        run: npm --prefix web run typecheck

      - name: Test web app
        run: npm --prefix web test

      - name: Build web app
        run: npm --prefix web run build

  compose:
    name: Compose migration boot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and API
        run: docker compose up --build --wait db api

      - name: Verify the Alembic head
        run: docker compose exec -T db psql -U opennosh -d opennosh -tAc "SELECT version_num FROM alembic_version" | grep -qx '20260820_0006'

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes
