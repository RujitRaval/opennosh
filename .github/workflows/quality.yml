name: quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  OPENNOSH_REQUIRED_ROLES: visitor,tracker

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: risk classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trust_protocol: ${{ steps.classify.outputs.trust_protocol }}
      security_policy: ${{ steps.classify.outputs.security_policy }}
      production: ${{ steps.classify.outputs.production }}
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Classify changed risk
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          PYTHONPATH=api:. uv run --frozen python scripts/check_trust_gates.py classify \
            --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  repository:
    needs: classify
    name: repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Validate risk-tiered trust gates
        run: PYTHONPATH=api:. uv run --frozen python scripts/check_trust_gates.py validate

      - name: Enforce pull-request metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m scripts.check_pr_metadata "$HEAD_REF" "$PR_TITLE"
      - name: Verify reproducible public font build
        run: uv run --frozen python scripts/build_public_fonts.py

      - name: Run repository tests
        run: PYTHONPATH=api:. uv run --frozen python -m unittest discover -s tests -v

      - name: Validate public package identities
        run: python3 scripts/check_packages.py

      - name: Validate governed forge policy
        run: python3 scripts/check_forge_policy.py

      - name: Validate Markdown documents
        run: python3 scripts/check_docs.py

      - name: Enforce generated contract import boundary
        run: python3 scripts/check_generated_imports.py

      - name: Check whitespace errors
        run: git diff --check HEAD^

  api:
    needs: classify
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://opennosh:opennosh@localhost:5432/opennosh_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opennosh_test
          POSTGRES_USER: opennosh
          POSTGRES_PASSWORD: opennosh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennosh -d opennosh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install API dependencies
        run: uv sync --frozen

      - name: Lint API and performance contract
        run: uv run ruff check api benchmarks scripts/build_federation_failure_drill_report.py scripts/build_public_fonts.py scripts/check_benchmark_contract.py scripts/check_database_capacity.py scripts/check_developer_compatibility.py scripts/check_changed_coverage.py scripts/check_trust_gates.py scripts/configure_trust_branch_protection.py tests/test_benchmark*.py tests/test_database_capacity_deployment.py tests/test_developer_compatibility.py tests/test_trust_gates.py api/tests/test_benchmark*.py

      - name: Type-check API and performance contract
        run: |
          uv run mypy
          uv run mypy --strict benchmarks/performance

      - name: Verify canonical OpenAPI contract
        run: |
          PYTHONPATH=api uv run python scripts/export_openapi.py
          git diff --exit-code -- web/lib/generated/openapi.json
          python3 scripts/check_openapi_compatibility.py --previous-ref HEAD^

      - name: Verify developer compatibility contract
        run: PYTHONPATH=api:. uv run python scripts/check_developer_compatibility.py

      - name: Validate food packs
        run: PYTHONPATH=api uv run python -m opennosh_api.foodpacks.validation packs --json

      - name: Validate versioned performance benchmark contract
        run: PYTHONPATH=api:. uv run python scripts/check_benchmark_contract.py

      - name: Validate global database capacity contract
        run: PYTHONPATH=api:. uv run python scripts/check_database_capacity.py

      - name: Test API with branch coverage
        run: |
          mkdir -p test-results
          PYTHONPATH=api uv run coverage run --branch --source=opennosh_api -m pytest api/tests
          uv run coverage json -o test-results/python-coverage.json

      - name: Enforce API coverage floors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run python scripts/check_changed_coverage.py \
            --coverage-json test-results/python-coverage.json \
            --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Upload API coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage
          path: test-results/python-coverage.json
          if-no-files-found: error
          retention-days: 14

      - name: Build and inspect Python distribution
        run: |
          uv build --out-dir dist
          python3 scripts/check_python_distribution.py dist
          uv run python scripts/check_installed_python_distribution.py \
            "dist/opennosh-$(cat VERSION)-py3-none-any.whl"

  trust-protocol:
    name: trust protocol coverage
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://opennosh:opennosh@localhost:5432/opennosh_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opennosh_test
          POSTGRES_USER: opennosh
          POSTGRES_PASSWORD: opennosh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennosh -d opennosh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Validate exact transitions roles and rescue outcomes
        run: PYTHONPATH=api:. uv run python scripts/check_trust_gates.py validate
      - name: Prove stable trust semantics on every pull request
        run: |
          PYTHONPATH=api:. uv run pytest \
            api/tests/federation/test_failure_drills.py \
            api/tests/workflow_testkit/test_contracts.py \
            api/tests/publication/test_planner.py \
            api/tests/governance/test_interventions.py

      - name: Prove the complete deterministic transition matrix
        if: needs.classify.outputs.trust_protocol == 'true' || github.event_name == 'push'
        run: |
          PYTHONPATH=api:. uv run pytest \
            api/tests/federation/test_failure_drills_integration.py \
            api/tests/workflow_testkit/test_publication_matrix.py

      - name: Prove every governed security-policy branch
        if: needs.classify.outputs.security_policy == 'true' || github.event_name == 'push'
        run: |
          PYTHONPATH=api:. uv run pytest \
            api/tests/governance/test_approval_integration.py \
            api/tests/publication/forge/test_adapter.py

  web:
    needs: classify
    name: web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Verify generated TypeScript contracts
        run: npm --prefix web run check:api-contracts

      - name: Validate Living Commons design system
        run: npm --prefix web run check:design-system

      - name: Enforce Living Commons font budgets
        run: npm --prefix web run check:font-budgets

      - name: Block hard-coded public interface copy
        run: npm --prefix web run check:localization

      - name: Lint web app
        run: npm --prefix web run lint

      - name: Type-check web app
        run: npm --prefix web run typecheck

      - name: Test web app with coverage floors
        run: npm --prefix web run test:coverage

      - name: Test npm bootstrap package
        working-directory: packages/npm
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Validate browser acceptance lane boundaries
        run: npm --prefix web run check:acceptance-boundaries

      - name: Test mocked UI journeys
        run: npm --prefix web run test:e2e:ui

      - name: Test shipped and pseudo-localized interfaces
        run: npm --prefix web run test:localization

      - name: Build web app
        run: npm --prefix web run build

      - name: Enforce public motion bundle budgets
        run: npm --prefix web run check:motion-budgets

      - name: Benchmark public motion profiles
        run: npm --prefix web run benchmark:motion -- --output test-results/motion-performance.json

      - name: Upload public motion performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-motion-performance
          path: web/test-results/motion-*.json
          if-no-files-found: error
          retention-days: 14

  visual:
    needs: classify
    name: visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install locked web dependencies
        run: npm --prefix web ci

      - name: Verify baseline hashes and approval metadata
        run: npm --prefix web run check:visual-baselines

      - name: Compare deterministic screenshots
        run: npm --prefix web run test:visual

      - name: Render diagnostic baseline candidate
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p web/test-results/visual-diffs
          cp -R web/test-results/visual/. web/test-results/visual-diffs/ 2>/dev/null || true
          npm --prefix web run test:visual -- --update-snapshots

      - name: Upload rendered visual diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-${{ github.run_attempt }}
          path: |
            web/test-results/visual
            web/test-results/visual-diffs
            web/playwright-report/visual
            web/tests/visual/__screenshots__
          if-no-files-found: ignore
          retention-days: 14

  vertical-acceptance:
    needs: classify
    name: Real vertical acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --prefix web

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Validate acceptance Compose configuration
        run: make acceptance-config

      - name: Start the real acceptance stack
        run: make acceptance-up

      - name: Run non-intercepted vertical trust journey
        run: make web-e2e-vertical

      - name: Capture vertical acceptance diagnostics
        if: failure()
        run: |
          mkdir -p web/test-results/vertical-acceptance
          make acceptance-ps > web/test-results/vertical-acceptance/compose-ps.txt || true
          make acceptance-logs > web/test-results/vertical-acceptance/compose.log 2>&1 || true
          make acceptance-copy-fixture || true

      - name: Upload vertical acceptance evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vertical-acceptance-evidence
          path: |
            web/test-results/vertical-acceptance
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the real acceptance stack
        if: always()
        run: make acceptance-down

  compose:
    needs: classify
    name: Compose application boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the application stack
        run: docker compose up --build --wait db api web ingress

      - name: Verify trusted ingress and rate-limit identity
        run: |
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused \
            -H 'X-Forwarded-For: 198.51.100.10' \
            'http://127.0.0.1:3000/api/v1/foods/search?q=apple'
          curl --fail \
            -H 'X-Forwarded-For: 203.0.113.20' \
            'http://127.0.0.1:3000/api/v1/foods/search?q=apple'
          docker compose exec -T db psql -U opennosh -d opennosh -tAc \
            "SELECT count(DISTINCT key_hash) FROM auth_rate_limits WHERE scope = 'food-search-ip'" \
            | grep -qx '1'

      - name: Verify the Alembic head
        run: |
          expected_head="$(docker compose exec -T api python -c \
            "from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config('/app/api/alembic.ini')).get_current_head())")"
          actual_head="$(docker compose exec -T db psql -U opennosh -d opennosh -tAc \
            "SELECT version_num FROM alembic_version")"
          test "$actual_head" = "$expected_head"

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes
