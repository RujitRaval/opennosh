name: release confidence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENNOSH_REQUIRED_ROLES: visitor,contributor,steward,tracker,maintainer,developer

concurrency:
  group: release-confidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts-packages:
    name: release contracts and packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: make install
      - name: Validate exact release inventory
        run: PYTHONPATH=api:. uv run python scripts/check_trust_gates.py validate
      - name: Validate contracts and packages
        run: |
          make contracts-check
          make package-check
          make build
      - name: Upload release package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-evidence
          path: |
            dist
            packages/npm/*.tgz
          if-no-files-found: ignore
          retention-days: 30

  browser-matrix:
    name: release browser role matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install locked web dependencies
        run: npm --prefix web ci
      - name: Validate release browser contracts
        run: |
          npm --prefix web test
          npm --prefix web run check:acceptance-boundaries
          npm --prefix web run check:visual-baselines
      - name: Run visitor contributor steward and tracker journeys
        run: |
          npm --prefix web run test:e2e:ui
          npm --prefix web run test:localization
          npm --prefix web run test:visual
      - name: Capture browser diagnostics
        if: failure()
        run: mkdir -p web/test-results/release-browser && cp -R web/playwright-report/. web/test-results/release-browser/ 2>/dev/null || true
      - name: Upload release browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-browser-evidence
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 30

  recovery:
    name: release upgrade rollback and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://opennosh:opennosh@localhost:5432/opennosh_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opennosh_test
          POSTGRES_USER: opennosh
          POSTGRES_PASSWORD: opennosh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennosh -d opennosh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.8"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Prove roles migration and receipt reconstruction
        run: |
          PYTHONPATH=api:. uv run pytest \
            api/tests/test_runtime_roles.py \
            api/tests/test_migrations.py \
            api/tests/publication/test_reconciliation_integration.py \
            tests/test_render_deployment.py
      - name: Prove final acceptance crash recovery
        run: PYTHONPATH=api:. uv run pytest api/tests/workflow_testkit/test_publication_matrix.py

  self-host:
    name: release self-host smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Boot supported self-host stack
        run: docker compose up --build --wait db api web ingress
      - name: Verify self-host health
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/api/v1/healthz
      - name: Capture self-host diagnostics
        if: failure()
        run: docker compose logs --no-color > self-host-compose.log 2>&1 || true
      - name: Upload self-host evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-self-host-evidence
          path: self-host-compose.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop self-host stack
        if: always()
        run: docker compose down --volumes
