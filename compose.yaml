services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=103"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opennosh}
      POSTGRES_USER: ${POSTGRES_USER:-opennosh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opennosh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  capacity-preflight:
    build:
      context: .
      dockerfile: api/Dockerfile
    command:
      - opennosh-capacity-preflight
      - --manifest
      - /app/config/database-capacity.v1.json
      - --require-live-database
      - --require-deployment-topology
      - --deployed-role
      - web=1
      - --deployed-role
      - publication=0
      - --deployed-role
      - evidence=0
      - --deployed-role
      - projection=0
      - --deployed-role
      - reconciler=0
      - --deployed-role
      - scheduler=0
    environment:
      DATABASE_CAPACITY_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-opennosh}:${POSTGRES_PASSWORD:-opennosh}@db:5432/${POSTGRES_DB:-opennosh}}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["opennosh-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-opennosh}:${POSTGRES_PASSWORD:-opennosh}@db:5432/${POSTGRES_DB:-opennosh}}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      DATABASE_CAPACITY_MANIFEST_PATH: /app/config/database-capacity.v1.json
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    depends_on:
      capacity-preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["opennosh-web"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-opennosh}:${POSTGRES_PASSWORD:-opennosh}@db:5432/${POSTGRES_DB:-opennosh}}
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:-}
      DATABASE_CAPACITY_MANIFEST_PATH: /app/config/database-capacity.v1.json
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      TRUSTED_WEB_PROXY_TOKEN: ${WEB_PROXY_TOKEN:-opennosh-local-web-proxy-token-2026}
      FOOD_SEARCH_RATE_LIMIT_ATTEMPTS: ${FOOD_SEARCH_RATE_LIMIT_ATTEMPTS:-120}
      FOOD_SEARCH_RATE_LIMIT_WINDOW_SECONDS: ${FOOD_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      FOOD_SEARCH_STATEMENT_TIMEOUT_MS: ${FOOD_SEARCH_STATEMENT_TIMEOUT_MS:-500}
      FOOD_SEARCH_CURSOR_SIGNING_KEYS: ${FOOD_SEARCH_CURSOR_SIGNING_KEYS:-v1:opennosh-development-search-cursor-key-2026}
      FOOD_SEARCH_CURSOR_LIFETIME_SECONDS: ${FOOD_SEARCH_CURSOR_LIFETIME_SECONDS:-900}
      FOOD_SEARCH_SNAPSHOT_REFRESH_SECONDS: ${FOOD_SEARCH_SNAPSHOT_REFRESH_SECONDS:-300}
      FOOD_SEARCH_SNAPSHOT_RETENTION_SECONDS: ${FOOD_SEARCH_SNAPSHOT_RETENTION_SECONDS:-1200}
      FOOD_SEARCH_SNAPSHOT_BUILD_TIMEOUT_MS: ${FOOD_SEARCH_SNAPSHOT_BUILD_TIMEOUT_MS:-30000}
      PUBLIC_COMMONS_LATEST_POINTER_PATH: /app/public-commons/latest.json
      PUBLIC_COMMONS_RELEASE_DIRECTORY: /app/public-commons/releases
      PUBLIC_COMMONS_CHECKPOINT_PATH: /app/public-commons-state/release-checkpoint.json
      PUBLIC_COMMONS_PROJECTION_PATH: /app/public-commons-state/homepage-snapshot.json
      PUBLIC_COMMONS_REFRESH_SECONDS: ${PUBLIC_COMMONS_REFRESH_SECONDS:-5}
      PUBLIC_COMMONS_REVALIDATION_URL: http://web:3000/api/internal/public-commons/revalidate
      PUBLIC_COMMONS_REVALIDATION_TOKEN: ${PUBLIC_COMMONS_REVALIDATION_TOKEN:-opennosh-local-public-commons-revalidation-token-2026}
      PUBLIC_COMMONS_VERIFYING_KEYS: ${PUBLIC_COMMONS_VERIFYING_KEYS:-development:Laz0b4AQMs1TfE090-MRSPubDqxptaEJ-HZXEsZe_lw}
      PUBLIC_COMMONS_STALE_AFTER_SECONDS: ${PUBLIC_COMMONS_STALE_AFTER_SECONDS:-300}
      TARGET_KCAL_FLOOR: ${TARGET_KCAL_FLOOR:-1200}
    volumes:
      - ${PUBLIC_COMMONS_ARTIFACT_DIRECTORY:-./var/public-commons}:/app/public-commons:ro
      - ${PUBLIC_COMMONS_STATE_DIRECTORY:-./var/public-commons-state}:/app/public-commons-state
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_PROXY_TOKEN: ${WEB_PROXY_TOKEN:-opennosh-local-web-proxy-token-2026}
      PUBLIC_COMMONS_REVALIDATION_TOKEN: ${PUBLIC_COMMONS_REVALIDATION_TOKEN:-opennosh-local-public-commons-revalidation-token-2026}
      OPENNOSH_PUBLIC_ROOT_ENABLED: ${OPENNOSH_PUBLIC_ROOT_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "3000"
    networks:
      - frontend
      - backend

  ingress:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    networks:
      - frontend

volumes:
  postgres-data:

networks:
  frontend:
  backend:
