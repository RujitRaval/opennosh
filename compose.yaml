services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opennosh}
      POSTGRES_USER: ${POSTGRES_USER:-opennosh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opennosh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-opennosh}:${POSTGRES_PASSWORD:-opennosh}@db:5432/${POSTGRES_DB:-opennosh}}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      TRUSTED_WEB_PROXY_TOKEN: ${WEB_PROXY_TOKEN:-opennosh-local-web-proxy-token-2026}
      FOOD_SEARCH_RATE_LIMIT_ATTEMPTS: ${FOOD_SEARCH_RATE_LIMIT_ATTEMPTS:-120}
      FOOD_SEARCH_RATE_LIMIT_WINDOW_SECONDS: ${FOOD_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      FOOD_SEARCH_STATEMENT_TIMEOUT_MS: ${FOOD_SEARCH_STATEMENT_TIMEOUT_MS:-500}
      FOOD_SEARCH_CURSOR_SIGNING_KEYS: ${FOOD_SEARCH_CURSOR_SIGNING_KEYS:-v1:opennosh-development-search-cursor-key-2026}
      FOOD_SEARCH_CURSOR_LIFETIME_SECONDS: ${FOOD_SEARCH_CURSOR_LIFETIME_SECONDS:-900}
      FOOD_SEARCH_SNAPSHOT_REFRESH_SECONDS: ${FOOD_SEARCH_SNAPSHOT_REFRESH_SECONDS:-300}
      FOOD_SEARCH_SNAPSHOT_RETENTION_SECONDS: ${FOOD_SEARCH_SNAPSHOT_RETENTION_SECONDS:-1200}
      FOOD_SEARCH_SNAPSHOT_BUILD_TIMEOUT_MS: ${FOOD_SEARCH_SNAPSHOT_BUILD_TIMEOUT_MS:-30000}
      TARGET_KCAL_FLOOR: ${TARGET_KCAL_FLOOR:-1200}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_PROXY_TOKEN: ${WEB_PROXY_TOKEN:-opennosh-local-web-proxy-token-2026}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "3000"
    networks:
      - frontend
      - backend

  ingress:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    networks:
      - frontend

volumes:
  postgres-data:

networks:
  frontend:
  backend:
