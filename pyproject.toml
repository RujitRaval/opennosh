[project]
name = "opennosh-api"
version = "0.1.0.0"
description = "Self-hosted nutrition and strength tracking."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "ijson>=3.4,<4",
  "jsonschema>=4.25,<5",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
opennosh = "opennosh_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["api/opennosh_api"]

[tool.pytest.ini_options]
pythonpath = ["api", "."]
testpaths = ["api/tests", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["api/opennosh_api"]

[tool.opennosh]
repository-kind = "application-foundation"
python-version = "3.11"
