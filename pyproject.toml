[project]
name = "opennosh"
dynamic = ["version"]
description = "Self-hosted nutrition and strength tracking."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES.md", "NOTICE.md", "AUTHORS.md"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "ijson>=3.4,<4",
  "jsonschema>=4.25,<5",
  "pgqueuer[asyncpg]==1.3.2",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
opennosh = "opennosh_api.cli:main"
opennosh-capacity-preflight = "opennosh_api.capacity:main"
opennosh-web = "opennosh_api.entrypoints.web:main"
opennosh-publication-worker = "opennosh_api.entrypoints.publication:main"
opennosh-evidence-worker = "opennosh_api.entrypoints.evidence:main"
opennosh-projection-worker = "opennosh_api.entrypoints.projection:main"
opennosh-reconciler = "opennosh_api.entrypoints.reconciler:main"
opennosh-scheduler = "opennosh_api.entrypoints.scheduler:main"
opennosh-migrate = "opennosh_api.entrypoints.migration:main"
opennosh-acceptance-fixture = "opennosh_api.acceptance.entrypoint:main"
opennosh-acceptance-publication-worker = "opennosh_api.acceptance.publication_worker:main"

[project.urls]
Homepage = "https://opennosh.org"
Repository = "https://github.com/RujitRaval/opennosh"
Issues = "https://github.com/RujitRaval/opennosh/issues"
Documentation = "https://github.com/RujitRaval/opennosh#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "fonttools[woff]==4.60.1",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["api/opennosh_api"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/food-pack.schema.json" = "opennosh_api/foodpacks/food-pack.schema.json"
"config/database-capacity.v1.json" = "opennosh_api/database-capacity.v1.json"
"config/federation-failure-drills.v1.json" = "opennosh_api/federation-failure-drills.v1.json"

[tool.hatch.build.targets.sdist]
include = [
  "api/opennosh_api",
  "schemas/food-pack.schema.json",
  "config/database-capacity.v1.json",
  "config/federation-failure-drills.v1.json",
  "AUTHORS.md",
  "LICENSE",
  "LICENSES.md",
  "NOTICE.md",
  "README.md",
  "VERSION",
  "pyproject.toml",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.pytest.ini_options]
pythonpath = ["api", "."]
testpaths = ["api/tests", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["api/opennosh_api"]

[tool.opennosh]
repository-kind = "application-foundation"
python-version = "3.11"
