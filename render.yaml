# Render Blueprint for the first opennosh production deployment.
# Keep resource names aligned with every fromDatabase/fromService reference.
previews:
  generation: "off"

databases:
  - name: opennosh-db
    databaseName: opennosh
    user: opennosh_admin
    plan: basic-256mb
    diskSizeGB: 5
    postgresMajorVersion: "16"
    region: ohio
    ipAllowList: []
    storageAutoscalingEnabled: false

services:
  - type: pserv
    name: opennosh-api
    runtime: docker
    plan: starter
    region: ohio
    repo: https://github.com/RujitRaval/opennosh
    branch: main
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    dockerCommand: python deploy/render_runtime.py api
    preDeployCommand: python deploy/render_runtime.py predeploy
    autoDeployTrigger: checksPass
    disk:
      name: opennosh-public-artifact-state
      mountPath: /var/lib/opennosh/public-artifacts
      sizeGB: 1
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: opennosh-db
          property: connectionString
      - key: DATABASE_CAPACITY_MANIFEST_PATH
        value: /app/config/database-capacity.v1.json
      - key: WEB_DATABASE_PASSWORD
        generateValue: true
      - key: MIGRATION_DATABASE_PASSWORD
        generateValue: true
      - key: PUBLICATION_DATABASE_PASSWORD
        generateValue: true
      - key: TRUSTED_WEB_PROXY_TOKEN
        generateValue: true
      - key: FOOD_SEARCH_CURSOR_SECRET
        generateValue: true
      - key: OPEN_FOOD_FACTS_ENABLED
        value: "false"
      - key: EVIDENCE_UPLOADS_ENABLED
        value: "false"
      - key: EVIDENCE_SANITIZATION_ENABLED
        value: "false"
      - key: GOVERNANCE_STEWARD_UI_ENABLED
        value: "false"
      - key: GOVERNANCE_MUTATIONS_ENABLED
        value: "false"
      - key: GOVERNANCE_PUBLIC_DECISIONS_ENABLED
        value: "false"
      - key: FEDERATION_SEARCH_ENABLED
        value: "false"
      - key: FEDERATION_INSTALLATION_ENABLED
        value: "false"
      - key: FEDERATION_PUBLIC_DISCOVERY_ENABLED
        value: "false"
      - key: MISSION_MUTATIONS_ENABLED
        value: "false"
      - key: MISSION_PROJECTION_ENABLED
        value: "false"
      - key: MISSION_PUBLIC_ENABLED
        value: "false"
      - key: MISSION_ACTIVITY_MAP_ENABLED
        value: "false"
      - key: MISSION_PACK_RELEASE_ENABLED
        value: "false"
      - key: GOVERNANCE_FRESH_AUTH_SECONDS
        value: "900"
      - key: PUBLIC_ARTIFACT_CHECKPOINT_PATH
        value: /var/lib/opennosh/public-artifacts/checkpoint/latest-v1.json
      - key: PUBLIC_ARTIFACT_CACHE_DIRECTORY
        value: /var/lib/opennosh/public-artifacts/cache

  - type: worker
    name: opennosh-publication
    runtime: docker
    plan: starter
    region: ohio
    repo: https://github.com/RujitRaval/opennosh
    branch: main
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    dockerCommand: python deploy/render_runtime.py publication
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_CAPACITY_MANIFEST_PATH
        value: /app/config/database-capacity.v1.json
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: opennosh-db
          property: connectionString
      - key: PUBLICATION_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: opennosh-api
          envVarKey: PUBLICATION_DATABASE_PASSWORD
      - key: PUBLICATION_CLAIMS_ENABLED
        value: "false"
      - key: PUBLICATION_CONTINUOUS_CLAIMS_ENABLED
        value: "false"
      - key: PUBLICATION_CLAIM_CONCURRENCY
        value: "1"
      - key: PUBLICATION_PREACTIVATION_SMOKE_ENABLED
        value: "false"
      - key: FEDERATION_INGESTION_ENABLED
        value: "false"
      - key: FEDERATION_PROJECTION_ENABLED
        value: "false"
      - key: FEDERATION_SEARCH_ENABLED
        value: "false"
      - key: FEDERATION_INSTALLATION_ENABLED
        value: "false"
      - key: FEDERATION_PUBLIC_DISCOVERY_ENABLED
        value: "false"
      - key: MISSION_MUTATIONS_ENABLED
        value: "false"
      - key: MISSION_PROJECTION_ENABLED
        value: "false"
      - key: MISSION_PUBLIC_ENABLED
        value: "false"
      - key: MISSION_ACTIVITY_MAP_ENABLED
        value: "false"
      - key: MISSION_PACK_RELEASE_ENABLED
        value: "false"
      - key: LATEST_REFRESH_ENABLED
        value: "true"
      - key: LATEST_REFRESH_INTERVAL_SECONDS
        value: "3600"
      - key: LATEST_REFRESH_AFTER_SECONDS
        value: "72000"
      - key: LATEST_POINTER_LIFETIME_SECONDS
        value: "82800"
      - key: PUBLIC_ARTIFACT_BASE_URL
        value: https://commons-artifacts.opennosh.org
      - key: PUBLIC_ARTIFACT_TIMEOUT_SECONDS
        value: "2"
      - fromGroup: opennosh-online-manifest-signer
      - fromGroup: opennosh-r2-writer

  - type: web
    name: opennosh-web
    runtime: docker
    plan: starter
    region: ohio
    repo: https://github.com/RujitRaval/opennosh
    branch: main
    dockerContext: .
    dockerfilePath: ./web/Dockerfile
    dockerCommand: /app/render-web-start.sh
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    domains:
      - opennosh.org
    envVars:
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: opennosh-api
          property: hostport
      - key: WEB_PROXY_TOKEN
        fromService:
          type: pserv
          name: opennosh-api
          envVarKey: TRUSTED_WEB_PROXY_TOKEN
      - key: OPENNOSH_PUBLIC_ROOT_ENABLED
        value: "true"
      - key: OPENNOSH_PUBLIC_NAV_FEATURES
        value: "explorer-search"
      - key: OPENNOSH_TRACKER_STRENGTH_ENTRY_ENABLED
        value: "false"
      - key: OPENNOSH_GOVERNANCE_STEWARD_UI_ENABLED
        value: "false"
      - key: PUBLIC_ARTIFACT_READS_ENABLED
        value: "false"
